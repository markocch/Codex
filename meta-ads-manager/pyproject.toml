[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-ads-manager"
version = "0.1.0"
description = "Gestor de Tráfego IA: relatórios Meta Ads exclusivamente GET"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
meta-ads = "meta_ads.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
